name: "prawdziwki (grupa Boletus edulis)"
weights:
  host: 0.40
  site: 0.35
  age: 0.25

host_affinity:
  SO: 1.0
  SW: 1.0
  BK: 0.9
  DB: 0.8
  DB.S: 0.8
  DB.B: 0.8
  JD: 0.8
  BRZ: 0.7
  GB: 0.3
  MD: 0.3
  DG: 0.3
  LP: 0.3
  OS: 0.2
  TP: 0.2
  OL: 0.0
  JS: 0.0
  KL: 0.0
  WZ: 0.0
  AK: 0.0
  # Uzupelnienie 2.1 (docs/projekt-borowik.md §5.3, §0.1 audit): codes found
  # in a real 25km run with no profile entry, previously falling back to
  # unknown_host_affinity (0.5) for ~220 stands.
  SO.C: 0.6   # sosna czarna -- obce EcM Pinus, slabo udokumentowane dla B. edulis
  SO.WE: 0.6  # sosna wejmutka -- jw.
  DB.C: 0.4   # dab czerwony -- obcy gatunek, EcM, slabo udokumentowany
  JW: 0.0     # jawor (klon) -- brak EcM
  OL.S: 0.0   # olsza szara -- brak EcM
  WB: 0.1     # wierzba -- w PL rzadko EcM dla Boletus
  # User decision 2026-09-24: not named in the plan's table (only its "inne
  # pojedyncze" catch-all) -- both Prunus/Sorbus are AM, not EcM, genera,
  # same reasoning as OL/JS/KL/WZ/AK below.
  CZM.P: 0.0  # czeremcha pozna (Prunus serotina) -- brak EcM. Comment fixed
              # 2.1 step B2: f_tree_species_dic says "pozna", not "pospolita"
              # (that's plain CZM below) -- value unchanged, both non-EcM.
  JB: 0.0     # jarzab -- brak EcM
  # Uzupelnienie 2.1 step B2 (docs/bdl-paczki-rozpoznanie.md): species found
  # in real BDL package DRZEW composition (Bedziemysl area) with no profile
  # entry. Resolved via the package's own f_tree_species_dic (name + Latin
  # binomial), not guessed -- all non-EcM Prunus/Aesculus/Pyrus/Acer/Ulmus
  # genera per user instruction, except TP.C (poplar, same genus as TP).
  CZM: 0.0    # czeremcha pospolita, Prunus padus -- brak EcM
  KSZ: 0.0    # kasztanowiec bialy, Aesculus hippocastanum -- brak EcM
  CZR: 0.0    # czeresnia pospolita -- brak EcM (Prunus)
  SL.A: 0.0   # sliwa alycza, Prunus cerasifera -- brak EcM
  GR: 0.0     # grusza pospolita, Pyrus communis -- brak EcM
  KL.PE: 0.0  # klon pensylwanski, Acer pensylvanicum -- jak KL, brak EcM
  WZ.S: 0.0   # wiaz szypulkowy, Ulmus laevis -- jak WZ, brak EcM
  TP.C: 0.2   # topola czarna, Populus nigra -- jak TP
unknown_host_affinity: 0.5     # "nieznana domieszka" default, spec §4.3
# hard mask threshold, spec §4.2 (see plan note re: "Tp" ambiguity).
# JW, OL.S, WB, CZM.P, JB added per plan 2.1 step A1 / user decision
# 2026-09-24: masked when dominant (part_cd >= 8) even though WB keeps a
# small non-zero host_affinity above for when it's a minor admixture.
# CZM, KSZ, CZR, SL.A, GR, KL.PE, WZ.S added per step B2 -- same pattern,
# all zero-affinity above. TP.C (0.2, like TP) deliberately not masked.
zero_affinity_mask_species: [
  OL, JS, KL, WZ, AK, JW, OL.S, WB, CZM.P, JB,
  CZM, KSZ, CZR, SL.A, GR, KL.PE, WZ.S,
]

# site_type -> [S_site, moisture_cls] (0=suche,1=swieze,2=wilgotne,3=bagienne)
site_scores:
  BMSW: [1.00, 1]
  BSW:  [0.85, 1]
  LMSW: [0.85, 1]
  BMW:  [0.65, 2]
  BW:   [0.65, 2]
  LMW:  [0.65, 2]
  LSW:  [0.60, 1]
  BS:   [0.45, 0]
  LW:   [0.40, 2]
  BMB:  [0.15, 3]
  BB:   [0.15, 3]
  LMB:  [0.15, 3]
  OL:   [0.0, 3]
  OLJ:  [0.0, 3]
  LL:   [0.0, 2]
  # Uzupelnienie 2.1 (docs/projekt-borowik.md §5.3, §0.1 audit): highland
  # (wyzynny) site types found in a real 25km run, previously falling back
  # to unknown_site_score (0.5) for ~2100 stands. Value = the lowland
  # equivalent of the same fertility/moisture class (plan's explicit
  # mapping); confirmed against the BDL habitat-type naming convention
  # (encyklopedialesna/Wikipedia), not guessed -- see the raw-code comment
  # in tests/test_profile_coverage.py for why e.g. LWYZS looks truncated.
  BMWYZ:  [1.00, 1]   # bor mieszany wyzynny (swiezy) ~= BMSW
  LMWYZ:  [0.85, 1]   # las mieszany wyzynny swiezy ~= LMSW
  LMWYZW: [0.65, 2]   # las mieszany wyzynny wilgotny ~= LMW
  LWYZS:  [0.60, 1]   # las wyzynny swiezy ~= LSW
  LWYZW:  [0.40, 2]   # las wyzynny wilgotny ~= LW
  LLWYZ:  [0.0, 2]    # las legowy wyzynny ~= LL (mask)
  OLJWYZ: [0.0, 3]    # ols jesionowy wyzynny ~= OLJ (mask)
unknown_site_score: 0.5
unknown_site_moisture_cls: 1

age_breakpoints:
  # Maska wieku: drzewostan mlodszy niz mask_below lat odpada z rankingu (na mapie szary,
  # powod "too_young"). 35 lat od decyzji wlasciciela 01.10.2026 po wyjezdzie (Rejon 1
  # "Laziska", migawka zawadzkie-01-10: mediana wieku 23 lata, prawie brak grzybow) --
  # zmiana OPARTA NA ZALOZENIU i jednej wizycie, NIE potwierdzona danymi (GBIF w 2.4 nie
  # pokazal slabszych mlodych drzewostanow); docs/RAPORT_FAZA_2.md, "Decyzje po walidacji" p. 3.
  # Poprzednie zachowanie: mask_below: 12.
  mask_below: 35
  segments:
    - {from: 12, to: 20, value_from: 0.3, value_to: 0.6}
    - {from: 20, to: 35, value_from: 0.6, value_to: 1.0}
    - {from: 35, to: 120, value_from: 1.0, value_to: 1.0}
  above_120: 0.9

habitat:
  # "neutral" (domyslny od decyzji wlasciciela po walidacji Fazy 2, sekcja
  # "Decyzje po walidacji" w docs/RAPORT_FAZA_2.md) = S_age = 1 dla wydzielen
  # spelniajacych maske wieku (< mask_below nadal odpada, bez kary za > 120 lat);
  # "curve" = dawna krzywa z age_breakpoints (zostaje dostepna). Powod: S_age nie
  # odroznia miejsc znalezisk od tla (AUC ~0,49-0,50), a rozklad wieku znalezisk
  # przeczy karze dla 12-35 lat. To usuniecie niepotwierdzonego zalozenia, nie
  # nowa krzywa.
  age_mode: neutral

age:
  # Plan wdrozenia 1.6.2: spec_age (from WFS/BDL a_year, "opisu
  # taksacyjnego") was never shifted forward to the analysis year -- a
  # stand described in 2020 still reported its 2020 age in a 2026 run.
  # True (default) applies wiek_obecny = wiek_z_opisu + (rok_analizy -
  # rok_stanu_opisu); false reproduces the pre-1.6.2 behaviour (raw
  # spec_age, no shift). Affects S_age AND the age mask (< 12 lat) --
  # pipeline.age_update.update_age, wired in pipeline.orchestrate.run_poc.
  update_to_analysis_year: true

host:
  # Plan wdrozenia 1.6.3: S_host today only ever looks at the DRZEW storey.
  # This blends in the pooled lower-storey composition (PODSZ/PODR/PRZES/...,
  # pipeline.bdl_packages.PackageComposition.species_lower) at weight w:
  # S_host = (1-w)*S_host_drzew + w*S_host_nizsze. Default 0 (pre-1.6.3
  # behaviour, DRZEW only) -- this is a HYPOTHESIS about understory
  # composition mattering for B. edulis, not a correction of a known error
  # (unlike 1.6.2's age fix), so it stays off pending Faza 2.2 validation.
  # docs/RAPORT_FAZA_1_6.md compares 0 / 0.25 / 0.5 on a real run.
  lower_storeys_weight: 0.0

fruiting:
  # Plan 2.1 "Zmiana 2" (user review 2026-09-25): 0.35 meant the AVERAGE
  # moisture percentile (0.5) already scored M=0.82 -> F="Bardzo dobre" --
  # confirmed on the real Bedziemysl 2026-09-25 export, where ALL 3656
  # mask-passing stands classified "Bardzo dobre" (zero differentiation
  # from F). 0.50 makes percentile 0.5 -> "Dobre" instead, matching the
  # intended reading of "average conditions". moisture_slope unchanged
  # per explicit user instruction -- do not change it without asking.
  moisture_midpoint: 0.50
  moisture_slope: 0.10
  # 2026-09-27 user decision: M from the (IMGW radar) rain balance only.
  # Open-Meteo's forecast soil moisture was ranked against an ERA5-Land
  # climatology from a DIFFERENT model (live ~0.14 vs climatology median
  # ~0.23 m3/m3 at Bedziemysl), so pct_sm sat at 0.00-0.04 almost
  # everywhere and jumped to ~0.48 inside ~10 km model soil blocks -- M was
  # driven by those blocks, not by rain. Revisit in A2 (own water balance).
  # 0.5 = the pre-2026-09-27 equal mean of both percentiles.
  soil_moisture_weight: 0.0
  temp_optimum_c: 13.0
  temp_sigma_c: 4.0
  heat_penalty_tmean5_c: 17.5
  heat_penalty_p5_mm: 5.0
  heat_penalty_factor: 0.3
  frost_tmin3_hard_c: -2.0
  frost_tmin3_soft_c: 0.0
  frost_hard_factor: 0.2
  frost_soft_factor: 0.6
  dry_pct_threshold: 0.3
  wet_pct_threshold: 0.8
  dry_multiplier_by_moisture: [0.6, 0.9, 1.2, 1.0]
  wet_multiplier_by_moisture: [1.15, 1.0, 0.85, 0.7]

fruiting_classes:
  - {max: 0.20, label: "Słabe warunki"}
  - {max: 0.45, label: "Umiarkowane"}
  - {max: 0.70, label: "Dobre"}
  - {max: 1.01, label: "Bardzo dobre"}

phenology:
  # Plan 2.1 "Zmiana 1" (user review 2026-09-25): static Boletus edulis
  # fruiting-season curve for Poland, from GBIF occurrence records --
  # queried live 2026-09-25 via
  # api.gbif.org/v1/occurrence/search?country=PL&scientificName=Boletus%20edulis&limit=0&facet=month&facetLimit=12,
  # n=1270 records with a recorded month (of ~1300 total occurrences).
  # Known bias: GBIF counts likely overrepresent Aug-Oct relative to true
  # fruiting frequency (more people are out foraging/reporting sightings
  # in peak season) -- still the only free PL-specific season curve
  # available, per user decision 2026-09-25. Stored statically (not
  # fetched per run) -- re-query and update this comment's date if this
  # curve is ever refreshed.
  gbif_monthly_counts: [1, 0, 0, 0, 2, 25, 118, 243, 471, 350, 58, 2]  # Jan..Dec
  # Floor for pipeline.phenology.compute_g_season's interpolated curve --
  # a genuinely fruitless month still isn't provably impossible with a
  # small, observation-biased sample, so G_season never reaches exactly 0.
  g_season_floor: 0.05
  # Explanation-note threshold (pipeline.explain.g_season_note): below this,
  # F's card/list explanation gets an extra "poza szczytem sezonu" note --
  # [E] plan decision, roughly "below half the GBIF peak month".
  g_season_note_threshold: 0.5

legal_mask:
  gdos_layers: ["GDOS:Rezerwaty", "GDOS:ParkiNarodowe"]   # spec §4.2, §9 step 8

population:
  # Plan wdrozenia 1.4: GUS NSP 2021 1km grid (zasob 24532) replaces OSM
  # place-node population as pipeline.pressure.compute_demand's point
  # source when a grid file is given (pipeline.prepare_trip's
  # --population-grid-path); buffer_km widens the query beyond the search
  # circle so a city just outside it still contributes via the existing
  # distance-decay term. Fallback values (osm_fallback_population_by_class)
  # are used only when no grid file is configured/found: OSM place nodes
  # with no population tag get this class default instead of silently 0,
  # source recorded as "osm_z_imputacja". These are rough (grubo) manual
  # estimates, not calibrated -- Demand's own formula is unchanged either
  # way (spec: "nie zmieniac wzoru Demand poza zrodlem punktow populacji").
  buffer_km: 30.0
  osm_fallback_population_by_class:
    hamlet: 50
    village: 500
    town: 5000
    city: 50000

pressure:
  k: 2.0                    # [E] gravity-model steepness, spec §4.5 -- unvalidated
  park_decay_m: 800.0       # spec §4.5 "exp(-d_parking/800 m)"
  demand_decay_km: 10.0     # spec §4.5 "1 + (d/10 km)^2"
  euclid_factor: 1.3        # spec §4.5 straight-line-to-real-road correction (MVP, no routing)
  alpha_default: 0.3        # spec §4.1 "α ∈ [0; 0,6] suwak, domyślnie 0,3"
  # Plan wdrozenia 1.5: "absolute" (default) normalizes Demand against a
  # fixed d_half instead of this run's own max (Demand_norm =
  # Demand/(Demand+d_half)) -- comparable P across different searches, and a
  # genuinely quiet area no longer looks as pressured as a city just because
  # nothing busier was in the search radius. "local" keeps the pre-1.5
  # behaviour (Demand_norm = Demand/max(Demand in this run)) for comparison.
  normalization: absolute
  # d_half chosen 2026-09-28 night, offline from cached data (no API calls):
  # real OSM Demand + d_park_m for all 14399 mask-passing Kieleczka 20km
  # stands (docs/porownania/baseline/scores_2026-09-28.json, cache-only
  # recompute of Demand), searched so median P under "absolute" lands close
  # to that run's actual median P=0.2446 under "local" (got 0.2437-0.2547
  # across the search grid around this value). TEMPORARY, UNCALIBRATED
  # against any real-world pressure measurement -- Bedziemysl's own cache
  # (the plan's original suggestion) no longer exists on this machine
  # (see docs/NOC_RAPORT.md); this is a same-scale substitute chosen to get
  # a working, non-arbitrary constant for tonight, not a validated number.
  d_half: 90000.0

  # Plan wdrozenia Faza 3: model presji. "access_points" (nowy): presja trafia
  # do wydzielenia wylacznie przez PUNKTY DOSTEPU (parkingi, wjazdy/szlabany,
  # osiedla przy lesie, droga leśna jako korytarz rowerowy); ludnosc tylko
  # wzmacnia punkty (A_k). "gravity": dotychczasowy model grawitacyjny od
  # centroidu wydzielenia (k, park_decay_m, demand_decay_km, d_half powyzej) --
  # zostaje do porownan i jako wybor awaryjny. Gdy przebieg nie ma danych
  # punktow dostepu (np. test/syntetyczne wejscie), pipeline.mvp uzywa gravity
  # i zapisuje to w manifescie (`pressure_model_used`).
  model: access_points
  # WSZYSTKIE parametry ponizej to hipoteza wlasciciela (plan 3.3), NIESKALIBROWANE.
  access_points:
    # Waga typu w_t, zasieg oddzialywania range_m (k(d)=max(0,1-(d/R)^2)^2,
    # bez twardej granicy) i zasieg zbierania ludnosci do atrakcyjnosci
    # (attractiveness_range_km, g(d) tym samym jadrem). a_half: A_norm=A/(A+a_half).
    types:
      parking:       {weight: 1.0, range_m: 3000.0, attractiveness_range_km: 20.0, a_half: 20000.0}
      entrance:      {weight: 0.6, range_m: 2500.0, attractiveness_range_km: 20.0, a_half: 20000.0}
      gate:          {weight: 0.6, range_m: 2500.0, attractiveness_range_km: 20.0, a_half: 20000.0}
      road_fallback: {weight: 0.4, range_m: 1500.0, attractiveness_range_km: 20.0, a_half: 20000.0}
      # osiedle: pieszo -- tylko ludnosc samego osiedla i oczek w ~1,5 km
      settlement:    {weight: 0.6, range_m: 1500.0, attractiveness_range_km: 1.5, a_half: 1500.0}
      # droga lesna = korytarz rowerowy; range_m = zasieg POPRZECZNY od drogi
      # (0,3 km, nie 1,0 -- plan 3.3); attractiveness_range_km = zasieg
      # dojazdu rowerem do punktu, od ktorego droga dziedziczy atrakcyjnosc.
      forest_road:   {weight: 0.4, range_m: 300.0, attractiveness_range_km: 8.0, a_half: 20000.0}
    # Odleglosc po sieci drogowej, przy ktorej dziedziczona atrakcyjnosc spada o polowe.
    network_half_km: 3.0
    # Mnoznik nawierzchni odcinka drogi lesnej (plan 3.2).
    surface_multiplier: {hard: 1.0, gravel: 0.8, compacted: 0.8, unknown: 0.5, dirt: 0.3}
    # Nasycenie: P = 1 - exp(-raw / S). S dobrane tak, by mediana P w
    # przebiegu Kieleczki byla zblizona do modelu gravity (TYMCZASOWO, jak d_half w 1.5).
    # Podzial ludnosci miedzy punkty dostepu (plan 3.2b): huff (domyslny) -- ludnosc
    # kazdego oczka GUS dzielona miedzy punkty w zasiegu dojazdu proporcjonalnie do
    # w_t * g(d), suma udzialow oczka = jego ludnosc; none -- kazdy punkt zbiera
    # ludnosc niezaleznie (pierwsza wersja Fazy 3). Osiedla przy lesie (pieszo) bez dzielenia.
    # huff_all (domyslny, decyzja wlasciciela 2026-09-29): jednolity podzial ludnosci
    # miedzy WSZYSTKIE typy punktow (rowniez osiedla), z opcja zewnetrzna c;
    # A_k w osobach, bez A/(A+a_half); waga typu tylko w podziale. huff i none zostaja do porownan.
    # two_stage (domyslny, decyzja wlasciciela 2026-09-29): etap 1 -- sposob dotarcia oczka
    # (pieszo: p_walk_max * max(0, 1 - d_las/walk_reach), reszta autem), etap 2 -- podzial
    # w obrebie sposobu (pieszo miedzy osiedla bez opcji zewnetrznej, autem jak huff_all z c).
    # huff_all, huff i none zostaja do porownan. Parametry tymczasowe, NIESKALIBROWANE.
    population_split: two_stage
    walk_share_max: 0.5      # p_walk_max: udzial idacych pieszo dla oczka przy samym lesie
    walk_reach_km: 1.5       # odleglosc oczka od lasu, przy ktorej p_walk spada do 0
    # Opcja zewnetrzna c ("nie jade do tego lasu") w mianowniku udzialu u_jk. TYMCZASOWE:
    # oczko z jednym parkingiem (w=1) w odleglosci 15 km oddaje mu 19,9% ludnosci
    # (g(15 km) = 0,191; 0,191 / (0,191 + 0,77)); dalej mniej. NIESKALIBROWANE.
    external_option_c: 0.77
    # Tylko do mapy (klasy niska/srednia/wysoka): A/(A + ta wartosc), osoby. Nie wchodzi do P.
    attractiveness_display_a_half: 500.0
    # Dolny prog presji od punktu danego typu, w osobach (tylko podzialy two_stage/huff_all):
    # wydzielenie w zasiegu parkingu dostaje z jego strony co najmniej prog * k(d), nawet gdy
    # w okolicy mieszka malo ludzi (P ok. 0,16 tuz obok parkingu uznane za zbyt male).
    # Bierze sie z najblizszego parkingu (max, nie suma). 700 osob = P ok. 0,30 przy samym
    # parkingu przy S = 1997 (1 - exp(-700/1997)). Decyzja wlasciciela 2026-09-30.
    # TYMCZASOWE, NIESKALIBROWANE. Brak klucza / {} = bez progu (zachowanie sprzed zmiany).
    pressure_floor_persons: {parking: 700.0}
    # S per wariant (te same mediany P co gravity w przebiegu Kieleczki, 0,373).
    # TYMCZASOWE, NIESKALIBROWANE (jak d_half w 1.5). none: 2026-09-29 offline.
    saturation_s: {two_stage: 1997.0, huff_all: 2489.0, huff: 0.1385, none: 7.0}
    # 3.1 -- dane punktow dostepu
    parking_osm_max_dist_to_forest_m: 200.0
    parking_dedupe_m: 100.0            # pierwszenstwo BDL
    entrance_dedupe_m: 150.0           # wjazdy i szlabany razem, szlaban ma pierwszenstwo
    entrance_continuation_m: 60.0      # droga publiczna przecina las: dukt/droga lesna musi zaczynac sie w tej odleglosci
    entrance_track_to_public_m: 300.0  # dukt przecina las: droga publiczna musi byc w tej odleglosci
    gate_max_dist_to_public_road_m: 300.0
    fallback_road_sample_m: 500.0      # fallback bez wjazdow: co ile metrow punkt na drodze asfaltowej
    fallback_road_max_dist_to_forest_m: 200.0
    fallback_min_forest_km2: 1.0       # kafel z mniejsza iloscia lasu nie dostaje fallbacku
    settlement_max_dist_to_forest_m: 200.0
    forest_buffer_m: 50.0              # drogi lesne biore z tego obrysu lasu
    corridor_sample_m: 100.0           # gestosc probkowania drogi lesnej przy liczeniu presji
    fire_surface_match_m: 20.0         # dojazd pozarowy BDL dostaje nawierzchnie od najblizszej drogi OSM z opisem w tej odleglosci
    snap_max_m: 150.0                  # przypiecie punktu dostepu do sieci drog lesnych
    # tagi OSM (osobny cache od glownego OSM: cache/access_tiles/osm)
    osm:
      highway_types: ["trunk", "primary", "secondary", "tertiary", "unclassified", "residential", "track", "service"]
      public_highway_types: ["trunk", "primary", "secondary", "tertiary", "unclassified", "residential"]
      paved_by_default_highway_types: ["trunk", "primary", "secondary", "tertiary", "residential"]
      closed_access_values: ["no", "private", "forestry", "agricultural", "delivery", "customers"]
      barrier_types: ["gate", "lift_gate"]
      hard_surfaces: ["asphalt", "paved", "concrete", "concrete:plates", "concrete:lanes", "paving_stones", "sett", "cobblestone", "bricks", "metal"]
      gravel_surfaces: ["gravel", "fine_gravel", "pebblestone", "crushed_stone", "chipseal"]
      compacted_surfaces: ["compacted"]
      dirt_surfaces: ["dirt", "ground", "earth", "mud", "grass", "sand", "grass_paver"]

weather:
  # Faza 4.1: odstep siatki pogodowej w km (temperatura, ET0, opad modelu).
  # null = dotychczasowe zachowanie (5 km przy promieniu 25 km, skalowane z
  # promieniem); 10 / 15 = odstep bezwzgledny, mniej wywolan Open-Meteo. Decyzja
  # o domyslnej wartosci: docs/RAPORT_FAZA_4.md (regula z planu 4.1).
  temp_grid_km: null

radar:
  # Plan 2026-09-26 A1 (docs/superpowers/plans/2026-09-26-borowik-radar-opady-a1.md):
  # IMGW-PIB RainGRS replaces Open-Meteo precipitation for local days in the
  # last window_days days; Open-Meteo fills missing hours and the forecast.
  enabled: true
  window_days: 30                # covers P26w (26 d) + P5
  min_coverage_for_quality: 0.8  # rain_radar_coverage threshold for pogoda_radar_1km
  # Plan 1.5 (docs/RAPORT_FAZA_1_5.md ma uzasadnienie i liczby):
  # "block" (sprzed 1.5, srednia RainGRS na cala kratke pogodowa, wspolna dla
  # wielu wydzielen) albo "stand" (RainGRS wazona powierzchniowo na WLASNYM
  # wielokacie kazdego wydzielenia, ~1 km). Tylko opad jest per-wydzielenie w
  # trybie stand -- temperatura/ET0/klimatologia zostaja na siatce blokowej.
  mode: stand
  # Promien filtra przestrzennego (komorki 1 km) przed probkowaniem, 0..3.
  # 0 = surowe dane 1 km. Patrz docs/RAPORT_FAZA_1_5.md 1.5.5 za uzasadnienie.
  smoothing_km: 1

flush:
  # Plan 2026-09-27 A2 (docs/superpowers/plans/2026-09-27-borowik-wysyp-a2.md):
  # flush-timing model, pipeline/flush.py. NEVER feeds R.
  # SHIP GATE FAILED 2026-09-27 (Task 3: LOYO held-out mean 0.548 <
  # baseline F_loc bez G_season 0.626; notebooks 08/09 traced the earlier
  # apparent rain-recency signal to a season confound). Frozen as an
  # uncalibrated experiment -- NOT imported by prepare_trip/frontend.
  # See pipeline/conditions_timeline.py for what shipped instead (Plan-B).
  wet_day_mm: 1.0
  pulse_min_mm: 15.0
  radar_rain_scale: 0.848
  t_base_c: 5.0
  cold_night_c: 5.0
  cold_night_factor: 0.5
  frost_c: -1.0
  dd_peak: 100.0
  dd_sigma: 35.0
  lookback_days: 45
  horizon_days: 7
  max_waves: 2
  level_thresholds: [0.1, 0.3, 0.6]

conditions:
  # Plan 2026-09-27 A2 "Plan-B" (docs/superpowers/plans/2026-09-27-borowik-wysyp-a2.md):
  # pipeline/conditions_timeline.py. Real F per horizon day (F's own
  # components -- the same formula whose per-stand, per-point form scored
  # 0.626 in the GBIF backtest, but computed here from the AREA MEDIAN of
  # the weather grid, ranked against pooled climatology -- a different,
  # not separately validated, aggregation) + a fact-only rain summary,
  # reusing only flush.py's pulse DETECTION (not its thermal clock/peak
  # model -- see the flush: section's comment above for why).
  wet_day_mm: 1.0
  pulse_min_mm: 15.0          # "big enough to mention" cutoff, not calibrated
  radar_rain_scale: 0.848     # radar/ERA5 rain ratio, notebooks/05 (note (25))
  lookback_days: 45
  horizon_days: 7
  max_rains: 2
  # Faza 4.4: jak z F punktow siatki powstaje wartosc panelu 7 dni:
  # median_of_features (dotychczasowa: mediana cech, potem jeden F) |
  # median_f_points | median_f_stands (wazona liczba wydzielen) | area_weighted_mean
  # (waga: powierzchnia lasu). Zmiana tylko wg reguly z planu 4.4 (roznica > 0,05
  # w ktoryms dniu). Po poprawce spojnosci panelu z mapa (opad z radaru jak w
  # wydzieleniach, percentyl wzgledem komorki punktu) max roznica metod wynosi 0,043
  # -- regula nie jest spelniona, wiec zostaje dotychczasowa metoda (wczesniejsza
  # roznica 0,086 wynikala z panelu liczonego z opadu modelu; docs/RAPORT_FAZA_4.md).
  aggregation: median_of_features
  # Faza 4.4: dobowy opad (mm) uznawany za "silny" w udziale powierzchni z silnym opadem.
  heavy_rain_day_mm: 15.0

ui:
  # Faza 4.5: oznaczenia niepewnosci prognozy w panelu 7 dni, w dniach naprzod od dzis
  # (dzis = 0). Hipoteza -- do zaktualizowania po weryfikacji prognoz (Faza 2.7,
  # po >= 30 dniach archiwum).
  forecast_uncertain_from_day: 4     # "prognoza niepewna"
  forecast_indicative_from_day: 8    # "orientacyjnie"

osm:
  parking_amenity: "parking"
  # spec §4.5 defines d_park against "publicznej drogi utwardzonej" (a public
  # PAVED road) -- "track" (unpaved forest track, usually closed to cars in
  # Lasy Panstwowe forests) is deliberately excluded: including it made
  # d_park (and so P's accessibility term) nearly constant across a tile,
  # found reviewing a real Faza 2 run (median P ~0.73 across 721 stands).
  # Accessibility plan Task 1 changed the Overpass fetch from `out center`
  # (a way's bounding-box centroid) to full LineString geometry, so this
  # euclidean d_park estimate is now true point-to-line distance, not the
  # centroid approximation this comment used to describe -- final review
  # noted the resulting baseline shift (median euclidean d_park on a real
  # tile: ~610m -> ~483m) is a real accuracy improvement, not a scope
  # change: still paved-only, still the same euclid_factor correction.
  road_highway_types: ["trunk", "primary", "secondary", "tertiary", "unclassified", "residential"]
  # "path"/"footway"/"bridleway" deliberately excluded: verified live
  # 2026-09-24 that adding "path" alone made the Overpass query for a real
  # 10x10 km forest tile (Pila) return a 504 in ~9s (a result-size/query-
  # complexity rejection, not a slow timeout -- the same query with
  # [timeout:120] failed identically) where paved-only and paved+track both
  # succeeded in ~2s. "track" is the dominant, already-verified-working
  # unpaved category and the primary real access mode for Lasy Panstwowe
  # forest roads; a real-world-discovered scope narrowing, not a
  # correctness compromise.
  routing_highway_types: ["trunk", "primary", "secondary", "tertiary", "unclassified", "residential", "track"]
  place_types: ["city", "town", "village", "hamlet"]

confidence:
  data_quality_factors:
    kompletnosc_gatunek_panujacy: 0.7     # spec §10: "0,7 tylko gatunek panujący (WFS)"
    kompletnosc_gatunek_nieznany: 0.5     # [E] MVP fallback: species_cd absent from host_affinity entirely
    kompletnosc_pelny_sklad: 1.0          # spec §10: "1,0 pełny skład" -- plan 2.1 step B2, S_host z paczki BDL (pipeline.bdl_packages), nie tylko z LMN jak pierwotnie zakładano
    swiezosc_bez_s2: 1.0                  # spec §10: "1,0 jeśli brak sygnału zmiany w S2" -- no S2 in this plan, always true
    pogoda_nwp_2km: 0.8                   # spec §10: "0,8 NWP 2 km" (Open-Meteo forecast/ICON-D2)
    pogoda_radar_1km: 0.9                 # [E] plan 2026-09-26 A1: opady z radaru IMGW RainGRS 1 km (temperatura nadal NWP) -- lepsze niz NWP 0,8, nie pelne 1,0
  data_quality_classes:
    - {max: 0.40, label: "NISKA"}
    - {max: 0.70, label: "SREDNIA"}
    - {max: 1.01, label: "WYSOKA"}
  model_confidence_cap: "SREDNIA"          # spec §10: "faza 1-4: maks. SREDNIA"
  # Plan wdrozenia 1.7: real radar coverage below this (with radar enabled)
  # is a NISKA-forcing gap, separate from data_quality_factors.pogoda_radar_1km
  # above (which only chooses which weather DQ multiplier applies, not
  # whether radar effectively failed for this stand).
  radar_low_coverage_threshold: 0.5
  reasons:
    model_uncalibrated: 'model nieskalibrowany na danych terenowych (limit do "średniej")'
    weather_nwp: "pogoda z modelu ~2 km (brak radaru w archiwum)"
    weather_radar: "opady z radaru IMGW ~1 km (RainGRS), temperatura z modelu ~2 km"
    species_dominant_only: "skład gatunkowy: tylko gatunek panujący"
    species_unknown: "gatunek panujący nierozpoznany w profilu gatunku"
    species_full_composition: "skład gatunkowy: pełny (paczka BDL)"  # plan 2.1 step B2
    # Plan wdrozenia 1.7: each forces final class down to NISKA (spec: obniz
    # do NISKA, gdy wystapi ktorykolwiek z realnych brakow), unlike the
    # reasons above which only explain the SREDNIA-level data quality score.
    empty_or_thin_climatology: "pusta klimatologia lub mało (<50%) ważnych wartości w oknie"
    radar_low_coverage: "rzeczywiste pokrycie radaru w oknie poniżej 50% (częściowy fallback na Open-Meteo)"
    osm_tile_skipped: "kafel OSM w otoczeniu wydzielenia pominięty (błąd sieci)"
    gdos_tile_skipped: "kafel GDOŚ w otoczeniu wydzielenia pominięty (błąd sieci)"
    unknown_site_type: "typ siedliskowy nierozpoznany w profilu"
    incomplete_composition: "skład gatunkowy z paczki niepełny (suma udziałów < 0,9)"

explanation:
  max_positive: 2   # spec §9: "generujemy zdania z szablonów (2 plusy i 1-2 minusy)"
  max_negative: 2

regions:
  # Plan 2.1 step A2 (docs/projekt-borowik.md §5.6 "Nowa definicja rejonu
  # (2.1)"): replaces the 2.0 buffer+unary_union chain-merge, which let one
  # region swallow an entire 187 km2 continuous forest complex on a real
  # 25km run (§0.1 audit, §5.6 "Stan 2.1").
  top_pct: 0.05              # candidate stands = top ~5% of R_final among mask_full-passing stands (was 0.25), spec §5.6 "Nowa definicja rejonu" step 1
  radius_m: 800.0            # region = candidates ENTIRELY within this radius of a chosen seed centroid (pipeline.regions._region_members) -- guarantees diameter <= 1600m by construction (2*radius_m, triangle inequality), verified against a real 25km cache export: 1425-1536m true diameter -- [E], plan decision
  min_area_ha: 5.0           # region must contain at least this much total candidate stand area, spec §5.6/§13.1 completion criterion -- [E], plan decision
  min_separation_m: 3000.0   # accepted regions' actual centroids must be at least this far apart, spec §5.6/§13.1 completion criterion -- [E], plan decision
  top_n_per_region: 5        # region score = median of the top N candidate R_final values in it, spec §5.6 step 3 -- [E], plan decision (unchanged)
  max_regions: 5             # spec §0/§12 "3-5 rejonów na wycieczkę" -- [E], plan decision (unchanged)

entrances:
  confirmed_tolerance_m: 50.0    # spec §5.5.2 -- [E] plan decision: entrance within this distance of a known OSM parking point counts as 'confirmed'
  top_n_for_routing: 25          # spec §13 priority 3 "top 20-30 wydzielen" -- [E] plan decision
