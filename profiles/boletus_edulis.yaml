name: "prawdziwki (grupa Boletus edulis)"
weights:
  host: 0.40
  site: 0.35
  age: 0.25

host_affinity:
  SO: 1.0
  SW: 1.0
  BK: 0.9
  DB: 0.8
  DB.S: 0.8
  DB.B: 0.8
  JD: 0.8
  BRZ: 0.7
  GB: 0.3
  MD: 0.3
  DG: 0.3
  LP: 0.3
  OS: 0.2
  TP: 0.2
  OL: 0.0
  JS: 0.0
  KL: 0.0
  WZ: 0.0
  AK: 0.0
  # Uzupelnienie 2.1 (docs/projekt-borowik.md §5.3, §0.1 audit): codes found
  # in a real 25km run with no profile entry, previously falling back to
  # unknown_host_affinity (0.5) for ~220 stands.
  SO.C: 0.6   # sosna czarna -- obce EcM Pinus, slabo udokumentowane dla B. edulis
  SO.WE: 0.6  # sosna wejmutka -- jw.
  DB.C: 0.4   # dab czerwony -- obcy gatunek, EcM, slabo udokumentowany
  JW: 0.0     # jawor (klon) -- brak EcM
  OL.S: 0.0   # olsza szara -- brak EcM
  WB: 0.1     # wierzba -- w PL rzadko EcM dla Boletus
  # User decision 2026-09-24: not named in the plan's table (only its "inne
  # pojedyncze" catch-all) -- both Prunus/Sorbus are AM, not EcM, genera,
  # same reasoning as OL/JS/KL/WZ/AK below.
  CZM.P: 0.0  # czeremcha pospolita -- brak EcM
  JB: 0.0     # jarzab -- brak EcM
unknown_host_affinity: 0.5     # "nieznana domieszka" default, spec §4.3
# hard mask threshold, spec §4.2 (see plan note re: "Tp" ambiguity).
# JW, OL.S, WB, CZM.P, JB added per plan 2.1 step A1 / user decision
# 2026-09-24: masked when dominant (part_cd >= 8) even though WB keeps a
# small non-zero host_affinity above for when it's a minor admixture.
zero_affinity_mask_species: [OL, JS, KL, WZ, AK, JW, OL.S, WB, CZM.P, JB]

# site_type -> [S_site, moisture_cls] (0=suche,1=swieze,2=wilgotne,3=bagienne)
site_scores:
  BMSW: [1.00, 1]
  BSW:  [0.85, 1]
  LMSW: [0.85, 1]
  BMW:  [0.65, 2]
  BW:   [0.65, 2]
  LMW:  [0.65, 2]
  LSW:  [0.60, 1]
  BS:   [0.45, 0]
  LW:   [0.40, 2]
  BMB:  [0.15, 3]
  BB:   [0.15, 3]
  LMB:  [0.15, 3]
  OL:   [0.0, 3]
  OLJ:  [0.0, 3]
  LL:   [0.0, 2]
  # Uzupelnienie 2.1 (docs/projekt-borowik.md §5.3, §0.1 audit): highland
  # (wyzynny) site types found in a real 25km run, previously falling back
  # to unknown_site_score (0.5) for ~2100 stands. Value = the lowland
  # equivalent of the same fertility/moisture class (plan's explicit
  # mapping); confirmed against the BDL habitat-type naming convention
  # (encyklopedialesna/Wikipedia), not guessed -- see the raw-code comment
  # in tests/test_profile_coverage.py for why e.g. LWYZS looks truncated.
  BMWYZ:  [1.00, 1]   # bor mieszany wyzynny (swiezy) ~= BMSW
  LMWYZ:  [0.85, 1]   # las mieszany wyzynny swiezy ~= LMSW
  LMWYZW: [0.65, 2]   # las mieszany wyzynny wilgotny ~= LMW
  LWYZS:  [0.60, 1]   # las wyzynny swiezy ~= LSW
  LWYZW:  [0.40, 2]   # las wyzynny wilgotny ~= LW
  LLWYZ:  [0.0, 2]    # las legowy wyzynny ~= LL (mask)
  OLJWYZ: [0.0, 3]    # ols jesionowy wyzynny ~= OLJ (mask)
unknown_site_score: 0.5
unknown_site_moisture_cls: 1

age_breakpoints:
  mask_below: 12
  segments:
    - {from: 12, to: 20, value_from: 0.3, value_to: 0.6}
    - {from: 20, to: 35, value_from: 0.6, value_to: 1.0}
    - {from: 35, to: 120, value_from: 1.0, value_to: 1.0}
  above_120: 0.9

fruiting:
  moisture_midpoint: 0.35
  moisture_slope: 0.10
  temp_optimum_c: 13.0
  temp_sigma_c: 4.0
  heat_penalty_tmean5_c: 17.5
  heat_penalty_p5_mm: 5.0
  heat_penalty_factor: 0.3
  frost_tmin3_hard_c: -2.0
  frost_tmin3_soft_c: 0.0
  frost_hard_factor: 0.2
  frost_soft_factor: 0.6
  dry_pct_threshold: 0.3
  wet_pct_threshold: 0.8
  dry_multiplier_by_moisture: [0.6, 0.9, 1.2, 1.0]
  wet_multiplier_by_moisture: [1.15, 1.0, 0.85, 0.7]

fruiting_classes:
  - {max: 0.20, label: "Słabe warunki"}
  - {max: 0.45, label: "Umiarkowane"}
  - {max: 0.70, label: "Dobre"}
  - {max: 1.01, label: "Bardzo dobre"}

legal_mask:
  gdos_layers: ["GDOS:Rezerwaty", "GDOS:ParkiNarodowe"]   # spec §4.2, §9 step 8

pressure:
  k: 2.0                    # [E] gravity-model steepness, spec §4.5 -- unvalidated
  park_decay_m: 800.0       # spec §4.5 "exp(-d_parking/800 m)"
  demand_decay_km: 10.0     # spec §4.5 "1 + (d/10 km)^2"
  euclid_factor: 1.3        # spec §4.5 straight-line-to-real-road correction (MVP, no routing)
  alpha_default: 0.3        # spec §4.1 "α ∈ [0; 0,6] suwak, domyślnie 0,3"

osm:
  parking_amenity: "parking"
  # spec §4.5 defines d_park against "publicznej drogi utwardzonej" (a public
  # PAVED road) -- "track" (unpaved forest track, usually closed to cars in
  # Lasy Panstwowe forests) is deliberately excluded: including it made
  # d_park (and so P's accessibility term) nearly constant across a tile,
  # found reviewing a real Faza 2 run (median P ~0.73 across 721 stands).
  # Accessibility plan Task 1 changed the Overpass fetch from `out center`
  # (a way's bounding-box centroid) to full LineString geometry, so this
  # euclidean d_park estimate is now true point-to-line distance, not the
  # centroid approximation this comment used to describe -- final review
  # noted the resulting baseline shift (median euclidean d_park on a real
  # tile: ~610m -> ~483m) is a real accuracy improvement, not a scope
  # change: still paved-only, still the same euclid_factor correction.
  road_highway_types: ["trunk", "primary", "secondary", "tertiary", "unclassified", "residential"]
  # "path"/"footway"/"bridleway" deliberately excluded: verified live
  # 2026-09-24 that adding "path" alone made the Overpass query for a real
  # 10x10 km forest tile (Pila) return a 504 in ~9s (a result-size/query-
  # complexity rejection, not a slow timeout -- the same query with
  # [timeout:120] failed identically) where paved-only and paved+track both
  # succeeded in ~2s. "track" is the dominant, already-verified-working
  # unpaved category and the primary real access mode for Lasy Panstwowe
  # forest roads; a real-world-discovered scope narrowing, not a
  # correctness compromise.
  routing_highway_types: ["trunk", "primary", "secondary", "tertiary", "unclassified", "residential", "track"]
  place_types: ["city", "town", "village", "hamlet"]

confidence:
  data_quality_factors:
    kompletnosc_gatunek_panujacy: 0.7     # spec §10: "0,7 tylko gatunek panujący (WFS)"
    kompletnosc_gatunek_nieznany: 0.5     # [E] MVP fallback: species_cd absent from host_affinity entirely
    swiezosc_bez_s2: 1.0                  # spec §10: "1,0 jeśli brak sygnału zmiany w S2" -- no S2 in this plan, always true
    pogoda_nwp_2km: 0.8                   # spec §10: "0,8 NWP 2 km" (Open-Meteo forecast/ICON-D2)
  data_quality_classes:
    - {max: 0.40, label: "NISKA"}
    - {max: 0.70, label: "SREDNIA"}
    - {max: 1.01, label: "WYSOKA"}
  model_confidence_cap: "SREDNIA"          # spec §10: "faza 1-4: maks. SREDNIA"
  reasons:
    model_uncalibrated: 'model nieskalibrowany na danych terenowych (limit do "średniej")'
    weather_nwp: "pogoda z modelu ~2 km (brak radaru w archiwum)"
    species_dominant_only: "skład gatunkowy: tylko gatunek panujący"
    species_unknown: "gatunek panujący nierozpoznany w profilu gatunku"

explanation:
  max_positive: 2   # spec §9: "generujemy zdania z szablonów (2 plusy i 1-2 minusy)"
  max_negative: 2

regions:
  top_pct: 0.25             # candidate stands = top 25% of R_final among mask_full-passing stands, spec §5.6 step 1 / §5.7
  buffer_m: 250.0            # merge candidate stands separated by up to this many metres into one region, spec §5.6 step 2 -- [E], plan decision
  top_n_per_region: 5        # region score = median of the top N candidate R_final values in it, spec §5.6 step 3 -- [E], plan decision
  max_regions: 5             # spec §0/§12 "3-5 rejonów na wycieczkę" -- [E], plan decision

entrances:
  confirmed_tolerance_m: 50.0    # spec §5.5.2 -- [E] plan decision: entrance within this distance of a known OSM parking point counts as 'confirmed'
  top_n_for_routing: 25          # spec §13 priority 3 "top 20-30 wydzielen" -- [E] plan decision
