[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grzyby"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "pyarrow>=17.0",
    "requests>=2.31",
    "requests-cache>=1.2",
    "openmeteo-requests>=1.2",
    "retry-requests>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "folium>=0.16",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
